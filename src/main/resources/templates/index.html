<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Login - Tienda Urbana</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #ffffff;
            color: #111111;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 40px 25px;
            background: #ffffff;
            border: 1px solid #eee;
        }

        .login-brand {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 30px;
            color: #111;
        }

        .login-subtitle {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #777;
            text-align: center;
            margin-bottom: 25px;
        }

        .input-urbano-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-urbano {
            width: 100%;
            padding: 14px 45px 14px 15px;
            font-size: 13px;
            font-weight: 500;
            color: #111;
            background-color: #ffffff;
            border: 1px solid #111;
            border-radius: 0;
            outline: none;
            transition: 0.3s;
        }

        .input-urbano::placeholder {
            color: #aaa;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .input-urbano:focus {
            border-color: #777;
            box-shadow: none !important;
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #111;
            font-size: 16px;
        }

        .form-check-input {
            border-radius: 0;
            border-color: #111;
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: #111;
            border-color: #111;
        }

        .form-check-input:focus {
            box-shadow: none;
            border-color: #111;
        }

        .form-check-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            color: #444;
        }

        .btn-urban-login {
            background: #111;
            color: #fff;
            border: 1px solid #111;
            border-radius: 0;
            padding: 14px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            width: 100%;
            transition: 0.3s;
        }

        .btn-urban-login:hover {
            background: #fff;
            color: #111;
            border-color: #111;
        }

        .link-minimal {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #777;
            text-decoration: none;
            transition: 0.3s;
        }

        .link-minimal:hover {
            color: #111;
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-brand">
        TIENDA URBANA
    </div>

    <p class="login-subtitle">Inicia sesión para continuar</p>

    <form th:action="@{/login}" method="post">

        <div class="input-urbano-group">
            <input type="text" name="username" class="input-urbano" placeholder="Usuario" required autocomplete="off">
            <i class="bi bi-person input-icon"></i>
        </div>

        <div class="input-urbano-group">
            <input type="password" name="password" class="input-urbano" placeholder="Contraseña" required>
            <i class="bi bi-lock input-icon"></i>
        </div>

        <div class="row align-items-center mb-4">
            <div class="col-6">
                <div class="form-check">

                </div>
            </div>
            <div class="col-6 text-end">
                <a href="/web" class="link-minimal">← Volver</a>
            </div>
        </div>

        <button type="submit" class="btn-urban-login">
            Ingresar al Sistema
        </button>

    </form>

    <div class="text-center mt-4">
        <a href="#" class="link-minimal" style="font-size: 10px;" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">¿Olvidaste tu contraseña?</a>
    </div>

</div>

<div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-0 p-2" style="border: 1px solid #111 !important;">
            <div class="modal-header border-0 bg-white rounded-0 pt-3 px-3 pb-0">
                <h6 class="modal-title fw-extrabold text-uppercase" style="letter-spacing: 2px; font-weight: 800; font-size: 16px;">Recuperar Cuenta</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="filter: grayscale(1);"></button>
            </div>
            <div class="modal-body px-3 py-4">
                <p class="text-muted small mb-4" style="letter-spacing: 0.5px; line-height: 1.6; font-size: 11px;">
                    INGRESA TU CORREO ELECTRÓNICO REGISTRADO. TE ENVIAREMOS UN ENLACE DIRECTO PARA RESTABLECER TU CONTRASEÑA DE MANERA SEGURA.
                </p>

                <form th:action="@{/recuperar-password}" method="post">
                    <div class="input-urbano-group mb-4">
                        <input type="email" name="correoRecuperacion" class="input-urbano" placeholder="Tu Correo Electrónico" required autocomplete="off">
                        <i class="bi bi-envelope input-icon"></i>
                    </div>
                    <button type="submit" class="btn-urban-login">
                        Enviar Enlace de Recuperación
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    const params = new URLSearchParams(window.location.search);

    // 1. CONTROL DE ERRORES ORIGINALES DEL LOGIN
    const error = params.get("error");
    if (error !== null) {
        let mensaje = "Usuario o contraseña incorrectos";

        if (error.includes("inactivo") || error.includes("disabled")) {
            mensaje = "Usuario inactivo";
        }
        if (error.includes("token_invalido")) {
            mensaje = "El enlace de recuperación ha expirado o es inválido.";
        }
        if (error.includes("mail_error")) {
            mensaje = "Hubo un problema de conexión al despachar el correo. Revisa tus credenciales de Gmail.";
        }

        Swal.fire({
            icon: "error",
            title: "Acceso denegado",
            text: mensaje,
            confirmButtonColor: "#111",
            customClass: { popup: 'border-0 rounded-0' }
        });
        window.history.replaceState({}, document.title, "/login");
    }

    // 2. CORREO ENVIADO CON ÉXITO
    if (params.get("recuperacionExito") !== null) {
        Swal.fire({
            icon: "success",
            title: "Enlace Despachado",
            text: "Si el correo coincide con una cuenta activa, recibirás un enlace de acceso en breve.",
            confirmButtonColor: "#111",
            customClass: { popup: 'border-0 rounded-0' }
        });
        window.history.replaceState({}, document.title, "/login");
    }

    // 3. CONTRASEÑA MODIFICADA CON ÉXITO
    if (params.get("passwordActualizada") !== null) {
        Swal.fire({
            icon: "success",
            title: "Clave Actualizada",
            text: "Tu nueva contraseña ha sido grabada. Ya puedes logearte.",
            confirmButtonColor: "#111",
            customClass: { popup: 'border-0 rounded-0' }
        });
        window.history.replaceState({}, document.title, "/login");
    }
</script>

</body>
</html>
