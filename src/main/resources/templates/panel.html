<!doctype html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    
<head>

    <meta charset="utf-8">

    <title>Panel | Sistema</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- ADMIN LTE -->
    <link rel="stylesheet"
          href="/adminlte/dist/css/adminlte.min.css">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- DATATABLE -->
    <link rel="stylesheet"
          href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<div class="app-wrapper">

    <!-- ================= HEADER ================= -->
    <nav class="app-header navbar navbar-expand bg-body">

        <div class="container-fluid">

            <!-- BOTON SIDEBAR -->
            <ul class="navbar-nav">

                <li class="nav-item">

                    <a class="nav-link"
                       data-lte-toggle="sidebar"
                       href="#">

                        <i class="bi bi-list"></i>

                    </a>

                </li>

            </ul>

            <!-- USUARIO -->
            <ul class="navbar-nav ms-auto">

                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle"
                       href="#"
                       data-bs-toggle="dropdown">

                        <i class="bi bi-person-circle"></i>

                        <span sec:authentication="name"></span>

                    </a>

                    <ul class="dropdown-menu dropdown-menu-end">

                        <li>

                            <span class="dropdown-item-text">

                                <i class="bi bi-person"></i>

                                Usuario activo

                            </span>

                        </li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        <li>

                            <form th:action="@{/logout}"
                                  method="post"
                                  style="margin:0;">

                                <button type="submit"
                                        class="dropdown-item text-danger">

                                    <i class="bi bi-box-arrow-right"></i>

                                    Cerrar sesión

                                </button>

                            </form>

                        </li>

                    </ul>

                </li>

            </ul>

        </div>

    </nav>

    <!-- ================= SIDEBAR ================= -->
    <aside class="app-sidebar bg-body-secondary shadow"
           data-bs-theme="dark">

        <!-- LOGO -->
        <div class="sidebar-brand d-flex align-items-center justify-content-center">

            <i class="bi bi-shield-lock fs-3 me-2"></i>

            <span class="brand-text fw-light fs-5">

                Sistema Admin

            </span>

        </div>

        <!-- MENU -->
        <div class="sidebar-wrapper">

            <nav class="mt-2">

                <ul class="nav sidebar-menu flex-column"
                    data-lte-toggle="treeview"
                    role="menu">

                    <!-- DASHBOARD -->
                    <li class="nav-item" th:if="${verDashboard}">

                        <a href="#"
                           class="nav-link active"
                           onclick="cargarVista('/dashboard')">
                            <i class="nav-icon bi bi-speedometer2"></i>

                            <p>Dashboard</p>

                        </a>

                    </li>

                    <!-- ================= SEGURIDAD ================= -->
                    <li class="nav-item">

                        <a href="#"
                           class="nav-link">

                            <i class="nav-icon bi bi-shield-check"></i>

                            <p>

                                Seguridad

                                <i class="nav-arrow bi bi-chevron-right"></i>

                            </p>

                        </a>

                        <ul class="nav nav-treeview">

                            <li class="nav-item" th:if="${verUsuarios}">

                                <a href="#"
                                   class="nav-link"
                                   onclick="cargarVista('/usuarios')">

                                    <i class="nav-icon bi bi-person"></i>

                                    <p>Usuarios</p>

                                </a>

                            </li>

                            <li class="nav-item"  th:if="${verRoles}">

                                <a href="#"
                                   class="nav-link"
                                   onclick="cargarVista('/roles')">

                                    <i class="nav-icon bi bi-person-badge"></i>

                                    <p>Roles</p>

                                </a>

                            </li>

                            <li class="nav-item" th:if="${verPermisos}">

                                <a href="#"
                                   class="nav-link"
                                   onclick="cargarVista('/permisos')">

                                    <i class="nav-icon bi bi-key"></i>

                                    <p>Permisos</p>

                                </a>

                            </li>

                        </ul>

                    </li>

                    <!-- ================= PRODUCTOS ================= -->
                    <li class="nav-item" th:if="${verProductos}">

                        <a href="#"
                           class="nav-link">

                            <i class="nav-icon bi bi-box-seam"></i>

                            <p>

                                Productos

                                <i class="nav-arrow bi bi-chevron-right"></i>

                            </p>

                        </a>

                        <ul class="nav nav-treeview">

                            <li class="nav-item" th:if="${verCategorias}">

                                <a href="#"
                                   class="nav-link"
                                   onclick="cargarVista('/categorias')">

                                    <i class="nav-icon bi bi-tags"></i>

                                    <p>Categorías</p>

                                </a>

                            </li>

                            <li class="nav-item" th:if="${verProductos}">

                                <a href="#"
                                   class="nav-link"
                                   onclick="cargarVista('/productos')">

                                    <i class="nav-icon bi bi-box"></i>

                                    <p>Productos</p>

                                </a>

                            </li>
                            <li class="nav-item" th:if="${verConfiguracion}">

                                <a href="#"
                                   class="nav-link"
                                   onclick="cargarVista('/configuracion')">

                                    <i class="nav-icon bi bi-gear-fill"></i>

                                    <p>
                                        Configuración Web
                                    </p>

                                </a>

                            </li>

                        </ul>

                    </li>

                    <li class="nav-item" th:if="${verVentas || verClientes}">

                        <a href="#"
                           class="nav-link">

                            <i class="nav-icon bi bi-cash-stack text-info"></i>

                            <p>

                                Comercial

                                <i class="nav-arrow bi bi-chevron-right"></i>

                            </p>

                        </a>

                        <ul class="nav nav-treeview">

                            <li class="nav-item" th:if="${verVentas}">

                                <a href="#"
                                   class="nav-link"
                                   onclick="cargarVista('/ventas')">

                                    <i class="nav-icon bi bi-cart-check"></i>

                                    <p>Ventas</p>

                                </a>

                            </li>

                            <li class="nav-item" th:if="${verClientes}">

                                <a href="#"
                                   class="nav-link"
                                   onclick="cargarVista('/clientes')">

                                    <i class="nav-icon bi bi-people-fill"></i>

                                    <p>Clientes</p>

                                </a>

                            </li>

                        </ul>

                    </li>

                        </ul>

                    </li>


                </ul>

            </nav>

        </div>

    </aside>

    <!-- ================= MAIN ================= -->
    <main class="app-main">

        <div id="contenido_principal"
             class="container-fluid mt-3">

        </div>

    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="app-footer text-center">

        <strong>

            © 2026 - Sistema Administrativo

        </strong>

    </footer>

</div>

<!-- ================= SCRIPTS ================= -->

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="/adminlte/dist/js/adminlte.min.js"></script>

<!-- DATATABLE -->
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<!-- SWEETALERT -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- FUNCTIONS -->
<script src="/js/functions.js"></script>

<script>

    window.addEventListener("load", () => {

    cargarVista('/dashboard');

    });


function cargarVista(ruta) {

    fetch(ruta)

        .then(res => {

            if (res.redirected) {

                window.location.href = res.url;

                return;
            }

            return res.text();

        })

        .then(html => {

            if (!html) return;

            document.getElementById("contenido_principal").innerHTML = html;

            // DATATABLES
            if (typeof iniciarDataTable === "function") {

                iniciarDataTable('#tabla_usuario_serverside');

                iniciarDataTable('#tabla_rol_serverside');

                iniciarDataTable('#tabla_permiso_serverside');

                iniciarDataTable('#tabla_categoria_serverside');

                iniciarDataTable('#tabla_producto_serverside');
            }

            // VALIDACIONES
            if (typeof activarValidaciones === "function") {

                activarValidaciones();
            }

        })

        .catch(err => console.error(err));
}

</script>

</body>
</html>
